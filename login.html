<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng Nhập Quản Lý — Sân Cầu Việt Đảng</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { inter: ['Inter', 'sans-serif'] },
          colors: {
            primary: { DEFAULT: '#16a34a', light: '#22c55e', dark: '#15803d', 50: '#f0fdf4' }
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #064e3b 0%, #065f46 30%, #14532d 70%, #0f172a 100%); min-height: 100vh; }
    .glass-card { background: rgba(255,255,255,0.08); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.15); }
    .input-field { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; transition: all .3s; }
    .input-field::placeholder { color: rgba(255,255,255,0.45); }
    .input-field:focus { outline: none; background: rgba(255,255,255,0.15); border-color: rgba(134,239,172,0.6); box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
    .btn-primary { background: linear-gradient(135deg, #16a34a, #15803d); box-shadow: 0 4px 15px rgba(22,163,74,0.4); transition: all .3s; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(22,163,74,0.5); }
    .btn-primary:active { transform: translateY(0); }
    .btn-google { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); transition: all .3s; }
    .btn-google:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
    .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.3; }
    .label-text { color: rgba(255,255,255,0.75); }
    .card-enter { animation: cardEnter .5s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes cardEnter { from { opacity:0; transform: translateY(30px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">

  <!-- Background orbs -->
  <div class="orb w-72 h-72 bg-green-400 top-10 -left-20" style="animation: float 8s ease-in-out infinite;"></div>
  <div class="orb w-96 h-96 bg-emerald-600 bottom-10 -right-20" style="animation: float 8s ease-in-out 3s infinite;"></div>
  <div class="orb w-48 h-48 bg-teal-300 top-1/2 left-1/2" style="animation: float 6s ease-in-out 1.5s infinite;"></div>

  <!-- Back to home -->
  <a href="index.html" class="absolute top-4 left-4 text-white/60 hover:text-white transition-colors text-sm flex items-center gap-1.5">
    <i class="fa-solid fa-arrow-left"></i> Về trang chủ
  </a>

  <!-- Login Card -->
  <div class="glass-card rounded-3xl p-8 w-full max-w-sm card-enter">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl mb-4 overflow-hidden bg-white/10">
        <img src="assets/logo.png" alt="Logo" class="w-16 h-16 object-cover rounded-xl" />
      </div>
      <h1 class="text-2xl font-bold text-white">Quản lý sân</h1>
      <p class="text-white/50 text-sm mt-1">Sân Cầu Việt Đảng</p>
    </div>

    <!-- Form Bypass (Login bằng pass/user bất kỳ) -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="label-text text-xs font-semibold uppercase tracking-wider block mb-1.5">
          <i class="fa-solid fa-user mr-1.5"></i>Tên đăng nhập
        </label>
        <input id="username" type="text" placeholder="admin" class="input-field w-full rounded-xl px-4 py-3 text-sm" autocomplete="username" />
      </div>
      <div>
        <label class="label-text text-xs font-semibold uppercase tracking-wider block mb-1.5">
          <i class="fa-solid fa-lock mr-1.5"></i>Mật khẩu
        </label>
        <div class="relative">
          <input id="password" type="password" placeholder="••••••••" class="input-field w-full rounded-xl px-4 py-3 text-sm pr-11" autocomplete="current-password" />
          <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-white/40 hover:text-white/80 transition-colors">
            <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-primary w-full text-white font-bold py-3.5 rounded-xl text-sm mt-2 flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span>Đăng nhập nhanh</span>
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-white/15"></div>
      <span class="text-white/40 text-xs font-medium">hoặc đăng nhập nhanh</span>
      <div class="flex-1 h-px bg-white/15"></div>
    </div>

    <!-- Google Sign-in Real -->
    <button id="googleLoginBtn" class="btn-google w-full text-white font-semibold py-3 rounded-xl text-sm flex items-center justify-center gap-2 cursor-pointer shadow-md">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="w-5 h-5" />
      <span>Đăng nhập bằng Google</span>
    </button>

    <p class="text-center text-white/40 text-xs mt-6">
      Hệ thống quản lý nội bộ Sân Cầu Việt Đảng
    </p>
  </div>

<script type="module">
  import { loginWithGoogle, onAuthChange } from "./firebase.js";

  // Check if logged in via sessionStorage or Firebase
  if (sessionStorage.getItem('isLoggedIn') === 'true') {
    window.location.href = 'manager.html';
  }

  onAuthChange(user => {
    if (user) {
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('adminName', user.displayName || user.email);
      sessionStorage.setItem('adminPhoto', user.photoURL || '');
      window.location.href = 'manager.html';
    }
  });

  window.togglePwd = function() {
    const pwd = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    pwd.type = pwd.type === 'password' ? 'text' : 'password';
    icon.className = pwd.type === 'password' ? 'fa-regular fa-eye text-sm' : 'fa-regular fa-eye-slash text-sm';
  };

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Đang xác thực...</span>';
    btn.disabled = true;
    setTimeout(() => {
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('adminName', document.getElementById('username').value.trim() || 'Admin');
      window.location.href = 'manager.html';
    }, 600);
  });

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    const btn = document.getElementById('googleLoginBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>Đang mở Google...';
    try {
      const user = await loginWithGoogle();
      sessionStorage.setItem('isLoggedIn', 'true');
      sessionStorage.setItem('adminName', user.displayName || user.email);
      sessionStorage.setItem('adminPhoto', user.photoURL || '');
      window.location.href = 'manager.html';
    } catch (err) {
      console.error(err);
      Swal.fire({
        icon: 'error',
        title: 'Đăng nhập thất bại',
        text: err.message,
        confirmButtonColor: '#ef4444'
      });
      btn.disabled = false;
      btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"><span>Đăng nhập bằng Google</span>';
    }
  });
</script>
</body>
</html>
